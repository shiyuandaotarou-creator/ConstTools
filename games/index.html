<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <div class="header">
        Games
    </div>
    <img src="../images/home.png" id="homeicon" onclick = "move('../index.html')">
    <div id="container">
        <img src="images/sushida_icon.png" class = "icon" onclick = "move('type_tester/index.html')">
        <img src="images/ice_skating_icon.png" class = "icon" onclick = "move('ice_skating/index.html')">
    </div>
</body>
<style>
        #homeicon{
        position: absolute;
        z-index: 1;
        width: 10vh;
    }
        .header {
        background-color: rgb(54, 133, 76);
        width: 100%;
        height: 20%;
        position: fixed;
        left: 0;
        top: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50px;
        font-family: "Comic Sans MS", cursive;
        font-weight: 700;
        color: white;
    }
    #container {
        position: absolute;
        top: 22%;
        left: 2.5%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5%;
    }
    .icon {
        height: 90%;
        width: 90%;
    }
</style>
<script>
    function move(url){
        location.href = url;
    }
</script>
</html>
