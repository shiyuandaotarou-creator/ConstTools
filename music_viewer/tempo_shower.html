<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div id="inputDiv">
        <div id="footer">
            <input type="number" id="tempoInput">
            <input type="color" id="colorBox1" value="#ffffff">
            <input type="color" id="colorBox2" value="#ff0000">
        </div>
    </div>
    <script type="module" src="tempoloader.js"></script>
</body>
<style>
    #footer {
        position: absolute;
        width: 100%;
        height: 20%;
        background-color: rgb(58, 177, 92);
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2%;
        border-top: solid 5px white;
    }

    #inputDiv {
        left: 0;
        top: 0;
        position: fixed;
        width: 100%;
        height: 100%;
        background-color: red;
        display: grid;
    }

    #colorBox1 {
        width: 30%;
        height: 60%;
    }

    #colorBox2 {
        width: 30%;
        height: 60%;
    }

    #tempoInput {
        text-align: center;
        font-size: 300%;
        z-index: 2;
        bottom: 0%;
        width: 30%;
        height: 60%;
    }
</style>

</html>
